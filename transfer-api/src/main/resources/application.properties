quarkus.application.name=transfer-api
quarkus.http.port=${TRANSFER_API_HTTP_PORT:8081}

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:15432/bank_transfer}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD}
quarkus.datasource.jdbc.max-size=${DATABASE_MAX_POOL_SIZE:16}
quarkus.datasource.jdbc.min-size=${DATABASE_MIN_POOL_SIZE:2}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=${QUARKUS_LOG_SQL:false}

# Kafka / SmallRye Reactive Messaging
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
mp.messaging.connector.smallrye-kafka.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8083}
mp.messaging.connector.smallrye-kafka.apicurio.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8083}
mp.messaging.outgoing.transfer-created.connector=smallrye-kafka
mp.messaging.outgoing.transfer-created.topic=${KAFKA_TRANSFER_TOPIC:bank.transfer.created}
mp.messaging.outgoing.transfer-created.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.transfer-created.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.outgoing.transfer-created.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8083}
mp.messaging.outgoing.transfer-created.acks=all
mp.messaging.outgoing.transfer-created.retries=${KAFKA_RETRIES:3}

# External exchange-rate API
exchange-rate-api.base-url=${EXCHANGE_RATE_API_BASE_URL:https://api.frankfurter.dev}
exchange-rate-api.connect-timeout=${EXCHANGE_RATE_API_CONNECT_TIMEOUT:2S}
exchange-rate-api.read-timeout=${EXCHANGE_RATE_API_READ_TIMEOUT:3S}
quarkus.rest-client.exchange-rate-api.url=${EXCHANGE_RATE_API_BASE_URL:https://api.frankfurter.dev}

# Application settings
app.kafka.topic=${KAFKA_TRANSFER_TOPIC:bank.transfer.created}
app.security.jwt.issuer=${JWT_ISSUER:bank-transfer}
app.security.jwt.expiration=${JWT_EXPIRATION:15M}
app.security.jwt.secret=${JWT_SECRET}
app.security.demo-password=${DEMO_PASSWORD}
app.security.admin-email=${ADMIN_EMAIL:admin@bank-transfer.local}

# JWT validation/signing. JWT_SECRET and DEMO_PASSWORD are mandatory runtime secrets.
mp.jwt.verify.issuer=${JWT_ISSUER:bank-transfer}
mp.jwt.verify.publickey.algorithm=HS256
quarkus.http.auth.permission.public.paths=/api/v1/auth/login
quarkus.http.auth.permission.public.policy=permit

# Local development and tests do not provision infrastructure automatically.
quarkus.devservices.enabled=false
%test.quarkus.http.test-port=8181
%test.quarkus.log.category."org.acme".level=INFO
%test.app.security.jwt.secret=bank-transfer-development-secret-change-me
%test.app.security.demo-password=secret
