quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:transfer-api-test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
mp.messaging.outgoing.transfer-created.connector=smallrye-in-memory
quarkus.rest-client.exchange-rate-api.url=http://localhost:9999
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.verify.key.location=test-jwt-secret.json
smallrye.jwt.verify.key-format=JWK

