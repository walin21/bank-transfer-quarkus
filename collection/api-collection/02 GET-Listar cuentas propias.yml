info:
  name: 02 GET-Listar cuentas propias
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/accounts"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        const accountId = data[0].id;

        if (accountId) {
          bru.setGlobalEnvVar("accountId", accountId)
          console.log("accountId guardado correctamente.");
        } else {
          console.error("No se encontró el accountId en la respuesta.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
