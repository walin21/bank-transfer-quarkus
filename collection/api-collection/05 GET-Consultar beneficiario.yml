info:
  name: 05 GET-Consultar beneficiario
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/beneficiaries/:beneficiaryId"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Accept
      value: application/json
  params:
    - name: beneficiaryId
      value: "{{beneficiaryId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
