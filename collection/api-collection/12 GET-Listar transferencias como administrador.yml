info:
  name: 12 GET-Listar transferencias como administrador
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/transfers?status=COMPLETED&customerId={{customerId}}"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: status
      value: COMPLETED
      type: query
    - name: customerId
      value: "{{customerId}}"
      type: query
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
