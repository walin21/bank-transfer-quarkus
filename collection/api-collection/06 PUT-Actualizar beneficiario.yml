info:
  name: 06 PUT-Actualizar beneficiario
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/beneficiaries/:beneficiaryId"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: beneficiaryId
      value: "{{beneficiaryId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "alias": "Ahorros USD actualizado",
        "bankName": "Banco Demo",
        "accountNumber": "002-000000099",
        "currency": "USD"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
