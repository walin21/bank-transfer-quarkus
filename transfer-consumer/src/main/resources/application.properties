quarkus.application.name=transfer-consumer
# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:15432/bank_transfer}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD}
quarkus.datasource.jdbc.max-size=${DATABASE_MAX_POOL_SIZE:16}
quarkus.datasource.jdbc.min-size=${DATABASE_MIN_POOL_SIZE:2}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=${QUARKUS_LOG_SQL:false}

# Kafka / SmallRye Reactive Messaging
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
mp.messaging.connector.smallrye-kafka.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8083}
mp.messaging.connector.smallrye-kafka.apicurio.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8083}
mp.messaging.incoming.transfer-created.connector=smallrye-kafka
mp.messaging.incoming.transfer-created.topic=${KAFKA_TRANSFER_TOPIC:bank.transfer.created}
mp.messaging.incoming.transfer-created.group.id=${KAFKA_GROUP_ID:transfer-consumer-group}
mp.messaging.incoming.transfer-created.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transfer-created.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.transfer-created.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8083}
mp.messaging.incoming.transfer-created.specific.avro.reader=true
mp.messaging.incoming.transfer-created.auto.offset.reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
mp.messaging.incoming.transfer-created.enable.auto.commit=false
mp.messaging.incoming.transfer-created.failure-strategy=fail

# Application settings
app.kafka.topic=${KAFKA_TRANSFER_TOPIC:bank.transfer.created}
app.kafka.group-id=${KAFKA_GROUP_ID:transfer-consumer-group}

# Local development and tests do not provision infrastructure automatically.
quarkus.devservices.enabled=false
%test.quarkus.log.category."org.acme".level=INFO
